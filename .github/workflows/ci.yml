name: CI

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches: [main]
#   pull_request:
# <<< ci-local:gated
on:
  workflow_dispatch:

permissions:
  contents: read
  # npm ci reads the org's @companionintelligence packages from GitHub Packages
  # with this run's GITHUB_TOKEN (webxr-ar-ai/.npmrc). The token can read them only
  # once each package grants this repository read access ("Manage Actions access"
  # in the package's settings; README, "Deploy"). Without the grant npm ci fails
  # with 403 permission_denied: read_package. An explicit permissions block drops
  # every scope it does not list, so packages: read must stay here.
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (unit + e2e + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webxr-ar-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webxr-ar-ai/package-lock.json

      - name: Install dependencies
        run: |
          if ! npm ci --no-audit --no-fund; then
            echo "::error::npm ci failed. A 403 read_package above means this repository has no read access to an @companionintelligence package yet (README, Deploy)."
            exit 1
          fi
        env:
          # Reads the org's @companionintelligence packages (see webxr-ar-ai/.npmrc).
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Canon lint (ci-lint-canon)
        run: npm run lint:canon

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright + IWER)
        run: npx playwright test

      - name: Production build
        run: npm run build

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webxr-ar-ai/playwright-report/
          retention-days: 7

  cv-server:
    name: CV server (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The full server needs torch + model weights; CI just guards that the
      # module parses and compiles.
      - name: Compile check
        run: python -m py_compile cv-server/main.py

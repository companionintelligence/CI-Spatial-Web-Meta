name: Deploy (Cloudflare)

# Manual only — see docs/CI.md for why automatic triggers are gated off.
on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + wrangler deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webxr-ar-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webxr-ar-ai/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Optional — connecting to a ci-server via OAuth is inert until
          # these are set (repo Settings > Secrets and variables > Actions >
          # Variables). See webxr-ar-ai/.env.example.
          VITE_DEFAULT_SERVER_URL:       ${{ vars.VITE_DEFAULT_SERVER_URL }}
          VITE_CI_OAUTH_AUTHORIZE_URL:   ${{ vars.VITE_CI_OAUTH_AUTHORIZE_URL }}
          VITE_CI_OAUTH_TOKEN_URL:       ${{ vars.VITE_CI_OAUTH_TOKEN_URL }}
          VITE_CI_OAUTH_CLIENT_ID:       ${{ vars.VITE_CI_OAUTH_CLIENT_ID }}
          VITE_CI_OAUTH_SCOPE:           ${{ vars.VITE_CI_OAUTH_SCOPE }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

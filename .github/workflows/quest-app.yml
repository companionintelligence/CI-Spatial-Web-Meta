name: Quest app (APK + AAB)

# Builds the Companion Scan Quest app: https://meta.ci.computer packaged for Meta
# Horizon OS with Meta's Bubblewrap (quest/, docs/quest-app.md). Manual only, like
# every workflow in this repository (docs/CI.md).
#
# - build: quest/build.sh generates the Android project from quest/twa-manifest.json
#   and builds the APK and the AAB, unsigned. This job never sees a signing secret.
# - sign: only when "sign" is ticked on a run from main. It runs in the quest-release
#   environment (add required reviewers there) and signs both with the release
#   keystore (quest/sign.sh). It refuses a keystore whose certificate is not the one
#   the site's /.well-known/assetlinks.json names: Horizon OS would not start that app.
#
# Nothing is published. The builds are workflow artifacts; docs/quest-app.md has the
# secrets, the variables and the release steps.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: versionName people see, for example 1.0.0 (blank keeps quest/twa-manifest.json)
        required: false
        default: ''
      version_code:
        description: versionCode, a whole number that must grow with every release (blank uses this run's number)
        required: false
        default: ''
      sign:
        description: Sign with the release keystore (main only; the quest-release environment approves the run)
        type: boolean
        default: false

permissions:
  contents: read

# Signed builds feed releases, so queue instead of cancelling a run halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE: https://meta.ci.computer

jobs:
  build:
    name: Build (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      name: ${{ steps.build.outputs.name }}
    steps:
      - name: Signed builds run from main only
        if: inputs.sign && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Signed builds run from main, not $GITHUB_REF_NAME. Run without \"sign\" for an unsigned build of this branch."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quest/package-lock.json

      - name: Check that the site serves the web manifest and the icon
        run: |
          # Bubblewrap copies both into the app from the live site, so deploy first.
          for path in /manifest.webmanifest /icon-512.png; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$SITE$path")
            if [ "$status" != 200 ]; then
              echo "::error::$SITE$path answers $status. Deploy the site from main first (README, Deploy)."
              exit 1
            fi
          done

      - name: Install the Android SDK packages Bubblewrap's Quest template needs
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-32" "build-tools;34.0.0" < /dev/null > /dev/null

      - name: Build the APK and the AAB
        id: build
        env:
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          quest/build.sh "$RUNNER_TEMP/unsigned" "$VERSION_CODE" "$VERSION_NAME"
          cp LICENSE NOTICE.md THIRD_PARTY.md "$RUNNER_TEMP/unsigned/"
          (cd "$RUNNER_TEMP/unsigned" && sha256sum -- *.apk *.aab > SHA256SUMS)
          apk=$(basename "$RUNNER_TEMP"/unsigned/*-unsigned.apk)
          echo "name=${apk%-unsigned.apk}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}-unsigned
          path: ${{ runner.temp }}/unsigned/
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign (release keystore)
    needs: build
    if: inputs.sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: quest-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Install the Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0" < /dev/null > /dev/null

      - name: Sign the APK and the AAB
        env:
          QUEST_KEYSTORE_BASE64: ${{ secrets.QUEST_KEYSTORE_BASE64 }}
          QUEST_KEYSTORE_PASSWORD: ${{ secrets.QUEST_KEYSTORE_PASSWORD }}
          QUEST_KEY_PASSWORD: ${{ secrets.QUEST_KEY_PASSWORD }}
          QUEST_KEY_ALIAS: ${{ vars.QUEST_KEY_ALIAS }}
        run: |
          missing=()
          [ -n "$QUEST_KEYSTORE_BASE64" ] || missing+=(QUEST_KEYSTORE_BASE64)
          [ -n "$QUEST_KEYSTORE_PASSWORD" ] || missing+=(QUEST_KEYSTORE_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets in the quest-release environment: ${missing[*]}. See docs/quest-app.md."
            exit 1
          fi

          # The certificate the site names for this package: the app starts only if they match.
          package=$(jq -r .packageId quest/twa-manifest.json)
          expected=$(curl -sf "$SITE/.well-known/assetlinks.json" \
            | jq -r --arg pkg "$package" \
              '[.[] | select(.target.package_name == $pkg) | .target.sha256_cert_fingerprints[]] | first // empty' \
            || true)
          if [ -z "$expected" ]; then
            echo "::error::$SITE/.well-known/assetlinks.json names no certificate for $package. Set QUEST_APP_CERT_SHA256 in webxr-ar-ai/wrangler.toml and deploy first (docs/quest-app.md)."
            exit 1
          fi

          export QUEST_KEYSTORE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$QUEST_KEYSTORE"' EXIT
          printf '%s' "$QUEST_KEYSTORE_BASE64" | base64 --decode > "$QUEST_KEYSTORE"
          EXPECTED_CERT_SHA256="$expected" quest/sign.sh "$RUNNER_TEMP/unsigned" "$RUNNER_TEMP/signed"

          cp "$RUNNER_TEMP"/unsigned/{LICENSE,NOTICE.md,THIRD_PARTY.md} "$RUNNER_TEMP/signed/"
          (cd "$RUNNER_TEMP/signed" && sha256sum -- *.apk *.aab > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
          retention-days: 30

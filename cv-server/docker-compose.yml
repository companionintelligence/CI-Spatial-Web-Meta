version: "3.9"

services:
  cv-server:
    build: .
    image: companion-scan-cv-server:latest
    ports:
      - "8000:8000"
    volumes:
      - ./weights:/weights
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - GLTF_STORE=/tmp/gltf_uploads
      - FLORENCE_MODEL_ID=microsoft/Florence-2-large
      # Comma-separated origins allowed to call /v1/* from a browser (CORS).
      # Default "*" is fine on a trusted LAN; if this server is reachable
      # from the internet, restrict it to your deployed frontend, e.g.
      # - CORS_ALLOW_ORIGINS=https://webxr.ci.computer,https://meta.ci.computer
      - CORS_ALLOW_ORIGINS=*
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

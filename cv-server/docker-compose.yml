version: "3.9"

services:
  cv-server:
    build: .
    image: companion-scan-cv-server:latest
    ports:
      - "8000:8000"
    volumes:
      - ./weights:/weights
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - GLTF_STORE=/tmp/gltf_uploads
      - FLORENCE_MODEL_ID=microsoft/Florence-2-large
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
